name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # build sin CUDA: el camino garantizado para consumidores sin nvcc/driver
          - label: cpu-only
            features: --no-default-features
          # default desde v2.6.0: feature cuda ON (compila sin nvcc; degrada en runtime)
          - label: default-cuda
            features: ""
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (${{ matrix.label }})
        run: cargo build --verbose ${{ matrix.features }}

      - name: Runtime smoke sin GPU (${{ matrix.label }})
        if: matrix.label == 'default-cuda'
        run: cargo run --quiet -- gpu-info

      - name: Run tests (${{ matrix.label }})
        run: cargo test --verbose ${{ matrix.features }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (default)
        run: cargo clippy -- -D warnings

      - name: Clippy (cpu-only)
        run: cargo clippy --no-default-features -- -D warnings

  # Standalone advisory scan: no `needs` to/from the other jobs, so a RustSec
  # registry outage here never blocks the main test/lint pipeline, while the
  # job itself still fails loudly on real advisories (continue-on-error is
  # intentionally NOT set).
  audit:
    name: Cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check dependencies for RUSTSEC advisories
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
